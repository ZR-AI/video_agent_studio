<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>图像与视频创作 Agent</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <div class="studio">
    <aside class="sidebar" aria-label="创作会话">
      <a class="brand" href="/" aria-label="图像与视频创作 Agent 首页"><span class="brand-mark" aria-hidden="true">V<span>✦</span></span><span>创作工作台</span></a>
      <button class="button new-session" id="new-session" type="button"><span aria-hidden="true">＋</span> 新建创作</button>
      <nav class="session-list" id="session-list" aria-label="最近会话"><p class="muted sidebar-empty">正在加载会话…</p></nav>
    </aside>

    <main class="workspace">
      <header class="workspace-header"><h1 id="session-title">新创作</h1></header>
      <div class="global-notice" id="global-notice" role="status" hidden></div>
      <section class="conversation" id="conversation" aria-label="需求对话" tabindex="0">
        <div class="welcome" id="welcome">
          <h2>你想创作什么？</h2>
        </div>
        <div class="messages" id="messages" aria-live="polite" aria-relevant="additions"></div>
        <div class="thinking" id="thinking" hidden><span class="thinking-dot"></span>正在整理你的创作计划…</div>
      </section>

      <section class="composer-area" aria-label="输入需求与素材">
        <form id="message-form" class="composer" aria-label="创作需求">
          <div class="composer-materials" id="drop-zone" role="group" aria-label="创作素材">
            <div class="asset-list" id="asset-list"></div>
            <div class="upload-row">
              <select id="asset-role" aria-label="素材类型"><option value="product">商品图</option><option value="scene">布景参考图</option><option value="reference">人物参考图</option><option value="costume">服装参考图</option><option value="pose">姿势参考图</option><option value="hair">发型参考图</option><option value="driver">动作驱动视频</option><option value="last_frame">尾帧图</option><option value="voice">音色参考音频</option></select>
              <button class="button button-secondary upload-button" type="button" id="upload-button" title="选择或拖入素材">＋ 添加素材</button>
              <input type="file" id="file-input" accept="image/*" multiple hidden>
            </div>
          </div>
          <label for="message-input" class="sr-only">描述创作需求</label>
          <textarea id="message-input" rows="3" placeholder="描述你想生成的图片或视频…" maxlength="20000"></textarea>
          <div class="composer-toolbar"><div class="tool-picker" id="tool-picker" role="group" aria-label="创作流程"></div><button class="send-button" id="send-button" type="submit" aria-label="发送需求" title="Enter 发送，Shift + Enter 换行">↑</button></div>
        </form>
      </section>
    </main>

    <aside class="inspector" aria-label="计划与执行结果">
      <section class="plan-section" aria-labelledby="plan-heading">
        <h2 id="plan-heading">计划</h2>
        <div class="plan-panel" id="plan-panel"><p class="empty-panel">暂无计划</p></div>
        <div class="execute-panel" id="execute-panel" hidden>
          <button class="button execute-button" id="execute-button" type="button" aria-describedby="payment-note execute-hint" disabled>确认并生成</button>
          <p class="payment-note" id="payment-note" hidden>确认后将使用云端额度</p>
          <p class="execute-hint" id="execute-hint" role="status" hidden></p>
        </div>
      </section>
      <section class="results-section" aria-labelledby="results-heading">
        <div class="results-heading">
          <h2 id="results-heading">任务与结果</h2>
          <button class="button button-secondary composition-open" id="open-composition" type="button" disabled>直播间合成</button>
        </div>
        <div class="jobs-list" id="jobs-list" aria-live="polite"><p class="empty-panel">暂无任务</p></div>
      </section>
    </aside>
  </div>
  <dialog class="composition-dialog" id="composition-dialog" aria-labelledby="composition-title">
    <form id="composition-form">
      <header class="composition-heading">
        <h2 id="composition-title">直播间合成</h2>
        <button class="button button-secondary" id="close-composition" type="button" aria-label="关闭直播间合成">关闭</button>
      </header>
      <div class="composition-body">
        <div class="composition-stage" id="composition-stage">
          <img id="composition-preview" alt="直播间合成预览" hidden>
          <p id="composition-placeholder">选择布景和人物后预览</p>
        </div>
        <div class="composition-controls">
          <label>直播布景<select id="composition-scene" required></select></label>
          <label>人物素材<select id="composition-person" required></select></label>
          <div class="composition-row">
            <label>幕布颜色<input id="composition-color" type="color" value="#00ff00"></label>
            <label id="composition-time">预览时间（秒）<input id="composition-seconds" type="number" min="0" step="0.1" value="0"></label>
          </div>
          <label>抠像强度<input id="composition-similarity" type="range" min="1" max="50" value="24"></label>
          <label>人物大小<input id="composition-scale" type="range" min="15" max="160" value="76"></label>
          <label>左右位置<input id="composition-x" type="range" min="0" max="100" value="50"></label>
          <label>上下位置<input id="composition-y" type="range" min="0" max="100" value="86"></label>
        </div>
      </div>
      <footer class="composition-footer">
        <p id="composition-status" role="status"></p>
        <button class="button button-secondary" id="render-composition" type="submit" disabled>预览</button>
        <button class="button execute-button" id="export-composition" type="button" disabled>导出视频</button>
      </footer>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
</body>
</html>
